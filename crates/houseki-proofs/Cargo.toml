[package]
name = "houseki-proofs"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = []
experimental-profiles = []
prover = ["dep:getrandom", "p3-util/prover-runtime", "dep:houseki-crypto", "dep:houseki-notes", "dep:houseki-state"]

[dependencies]
houseki-crypto = { workspace = true, optional = true, features = ["proofs"] }
houseki-notes = { workspace = true, optional = true, features = ["proofs"] }
houseki-state = { workspace = true, optional = true, features = ["proofs"] }
chacha20.workspace = true
tracing.workspace = true
p3-util.workspace = true
p3-maybe-rayon.workspace = true
houseki-types.workspace = true
thiserror.workspace = true
p3-field.workspace = true
p3-goldilocks.workspace = true
sha3.workspace = true
p3-air.workspace = true
p3-challenger.workspace = true
p3-commit.workspace = true
p3-dft.workspace = true
p3-fri.workspace = true
p3-matrix.workspace = true
p3-merkle-tree.workspace = true
p3-uni-stark.workspace = true
p3-symmetric.workspace = true
rand.workspace = true
zeroize.workspace = true
getrandom = { workspace = true, optional = true }

[dev-dependencies]
p3-util = { workspace = true, features = ["prover-runtime"] }
getrandom.workspace = true

[[example]]
name = "reward_withdrawal"
path = "examples/reward_withdrawal/main.rs"
required-features = ["prover", "experimental-profiles"]

[[example]]
name = "verify_reward_withdrawal"
required-features = ["experimental-profiles"]

[[example]]
name = "verify_payment"
required-features = ["experimental-profiles"]
