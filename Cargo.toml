[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["vendor/plonky3/air", "vendor/plonky3/util", "vendor/plonky3/dft", "vendor/plonky3/fri", "vendor/plonky3/uni-stark"]

[workspace.package]
edition = "2024"
rust-version = "1.99.1"
publish = false

[workspace.dependencies]
# internal
houseki-crypto = { path = "crates/houseki-crypto" }
houseki-notes = { path = "crates/houseki-notes" }
houseki-state = { path = "crates/houseki-state" }
houseki-types = { path = "crates/houseki-types" }

# encoding
base64ct = { version = "=1.8.3", default-features = false, features = ["alloc"] }

# types
crypto-bigint = { version = "=0.7.5", default-features = false, features = ["zeroize"] }

# cryptography
aes = { version = "=0.9.3", default-features = false, features = ["zeroize"] }
aes-gcm-siv = { version = "=0.12.1", default-features = false, features = ["aes", "zeroize"] }
sha3 = { version = "=0.11.0", default-features = false, features = ["zeroize"] }
sha2 = { version = "=0.11.1", default-features = false, features = ["zeroize"] }
hkdf = { version = "=0.13.0", default-features = false }
hmac = { version = "=0.13.0", default-features = false, features = ["zeroize"] }
ml-dsa = { version = "=0.1.1", default-features = false, features = ["alloc", "rand_core", "zeroize"] }
ml-kem = { version = "=0.3.2", default-features = false, features = ["zeroize"] }
polyval = { version = "=0.7.3", default-features = false, features = ["zeroize"] }
zeroize = { version = "=1.9.1", default-features = false, features = ["alloc"] }

# zero knowledge proofs
p3-util = { version = "=0.8.0", default-features = false }
p3-maybe-rayon = { version = "=0.8.0", default-features = false }
p3-air = { version = "=0.8.0", default-features = false }
p3-challenger = { version = "=0.8.0", default-features = false }
p3-commit = { version = "=0.8.0", default-features = false }
p3-dft = { version = "=0.8.0", default-features = false }
p3-fri = { version = "=0.8.0", default-features = false }
p3-matrix = { version = "=0.8.0", default-features = false }
p3-merkle-tree = { version = "=0.8.0", default-features = false }
p3-uni-stark = { version = "=0.8.0", default-features = false }
p3-field = { version = "=0.8.0", default-features = false }
p3-goldilocks = { version = "=0.8.0", default-features = false }
p3-symmetric = { version = "=0.8.0", default-features = false }

# private proof random generators
rand = { version = "=0.10.1", default-features = false, features = ["std_rng"] }
getrandom = { version = "=0.4.3", default-features = false, features = ["sys_rng"] }
chacha20 = { version = "=0.10.2", default-features = false, features = ["rng", "zeroize"] }

# logging
tracing = { version = "=0.1.44", default-features = false, features = ["std"] }

# error handling
thiserror = { version = "2.0.21" }

[patch.crates-io]
p3-util = { path = "vendor/plonky3/util" }
p3-dft = { path = "vendor/plonky3/dft" }
p3-fri = { path = "vendor/plonky3/fri" }
p3-uni-stark = { path = "vendor/plonky3/uni-stark" }
p3-air = { path = "vendor/plonky3/air" }
