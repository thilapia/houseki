[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
rust-version = "1.99.1"
publish = false

[workspace.dependencies]
# internal
houseki-types = { path = "crates/houseki-types" }

# cryptography
getrandom = { version = "=0.4.3", default-features = false, features = ["sys_rng"] }
ml-kem = { version = "=0.3.2", default-features = false, features = ["zeroize"] }
sha3 = { version = "=0.11.0", default-features = false }
zeroize = { version = "=1.9.1", default-features = false }

# error handling
thiserror = { version = "2.0.21" }
