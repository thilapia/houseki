[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
rust-version = "1.99.1"
publish = false

[workspace.dependencies]
# internal
houseki-types = { path = "crates/houseki-types" }

# cryptography
getrandom = { version = "=0.4.3", default-features = false, features = ["sys_rng"] }
sha3 = { version = "=0.11.0", default-features = false }
sha2 = { version = "=0.11.1", default-features = false, features = ["zeroize"] }
hkdf = { version = "=0.13.0", default-features = false }
hmac = { version = "=0.13.0", default-features = false, features = ["zeroize"] }
ml-kem = { version = "=0.3.2", default-features = false, features = ["zeroize"] }
p3-field = { version = "=0.8.0", default-features = false }
p3-goldilocks = { version = "=0.8.0", default-features = false }
p3-symmetric = { version = "=0.8.0", default-features = false }
zeroize = { version = "=1.9.1", default-features = false }

# error handling
thiserror = { version = "2.0.21" }
